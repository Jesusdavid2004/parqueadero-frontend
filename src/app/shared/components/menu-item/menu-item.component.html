<div class="menu-item" [class.nivel-1]="nivel === 1" [class.nivel-2]="nivel === 2" [class.nivel-3]="nivel >= 3">
  <a
    *ngIf="menu.ruta && !tieneHijos"
    [routerLink]="menu.ruta"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{exact: true}"
    class="menu-link"
    [class.inactive]="!menu.activo"
  >
    <span class="menu-text">{{ menu.nombre }}</span>
  </a>

  <button
    *ngIf="tieneHijos"
    type="button"
    class="menu-link"
    [class.has-children]="true"
    [class.expanded]="expanded"
    [class.inactive]="!menu.activo"
    [class.separator]="esSeparador"
    [disabled]="!menu.activo"
    (click)="toggle()"
  >
    <span class="menu-text">{{ menu.nombre }}</span>
    <span class="arrow">{{ expanded ? '▼' : '▶' }}</span>
  </button>

  <div class="submenu" *ngIf="expanded && tieneHijos">
    <app-menu-item
      *ngFor="let hijo of menu.hijos"
      [menu]="hijo"
      [nivel]="nivel + 1"
    ></app-menu-item>
  </div>
</div>
